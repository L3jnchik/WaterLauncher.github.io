<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaterProject — Личный Кабинет</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <script src="https://jsdelivr.net"></script>
    <style>
        :root { --primary-color: #4fc3f7; --accent-color: #2ecc71; --dark-bg: rgba(15, 15, 15, 0.95); }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://alphacoders.com') no-repeat center center fixed; background-size: cover; color: #fff; }
        nav { background: #0a0a0a; padding: 15px 50px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #222; }
        nav .brand { font-size: 1.8rem; font-weight: bold; color: var(--primary-color); text-decoration: none; text-shadow: 2px 2px 0 #000; }
        .main-container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .grid-panel { display: grid; grid-template-columns: 1fr 2fr; gap: 30px; }
        @media (max-width: 800px) { .grid-panel { grid-template-columns: 1fr; } }
        .card { background: var(--dark-bg); border: 1px solid #333; border-radius: 12px; padding: 25px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .card h3 { margin-top: 0; color: var(--primary-color); border-bottom: 1px solid #222; padding-bottom: 10px; }
        .input-field { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #444; border-radius: 6px; background: #050505; color: #fff; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        .btn-green { background: var(--accent-color); color: #fff; } .btn-green:hover { background: #27ae60; }
        .btn-blue { background: var(--primary-color); color: #000; } .btn-blue:hover { background: #29b6f6; }
        .skin-preview { background: #050505; border: 2px dashed #333; height: 300px; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; position: relative; overflow: hidden; }
        .skin-image { height: 90%; image-rendering: pixelated; }
        .balance-badge { background: #f39c12; color: #000; padding: 5px 15px; border-radius: 20px; font-weight: bold; display: inline-block; margin-bottom: 15px; }
        .hidden { display: none; } .status-msg { text-align: center; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="brand">🌊 WATERPROJECT</a>
        <span id="navUser" style="color: #888;"><i class="fa-solid fa-user"></i> Гость</span>
    </nav>

    <div class="main-container">
        <!-- Блок входа/регистрации -->
        <div id="authBlock" class="card" style="max-width: 400px; margin: 0 auto;">
            <h3 id="authTitle">Личный Кабинет</h3>
            <form onsubmit="return false;">
                <input type="text" id="username" class="input-field" placeholder="Ваш никнейм Minecraft" required maxlength="16">
                <input type="password" id="password" class="input-field" placeholder="Ваш пароль" required>
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button type="button" id="loginBtn" class="btn btn-blue">Войти</button>
                    <button type="button" id="regBtn" class="btn btn-green">Регистрация</button>
                </div>
            </form>
            <div id="authMessage" class="status-msg"></div>
        </div>

        <!-- Панель личного кабинета (скрыта по умолчанию) -->
        <div id="lkBlock" class="grid-panel hidden">
            <div class="card" style="text-align: center;">
                <h3>Персонаж</h3>
                <div class="balance-badge"><i class="fa-solid fa-coins"></i> Баланс: <span id="userBalance">0</span> монет</div>
                <div class="skin-preview">
                    <img id="skinImg" class="skin-image" src="https://minotar.net" alt="Skin">
                </div>
                <p id="lkUsername" style="font-size: 1.2rem; font-weight: bold; margin: 0;"></p>
            </div>

            <div class="card">
                <h3>Управление аккаунтом</h3>
                <div style="margin-bottom: 25px;">
                    <label style="font-weight: bold; display: block; margin-bottom: 5px;"><i class="fa-solid fa-shirt"></i> Установка скина (.PNG)</label>
                    <input type="file" id="skinFile" accept=".png" class="input-field">
                    <button type="button" id="uploadSkinBtn" class="btn btn-blue" style="padding: 8px;">Загрузить скин</button>
                </div>
                <div style="margin-bottom: 25px;">
                    <label style="font-weight: bold; display: block; margin-bottom: 5px;"><i class="fa-solid fa-cloak"></i> Установка плаща (.PNG)</label>
                    <input type="file" id="capeFile" accept=".png" class="input-field">
                    <button type="button" id="uploadCapeBtn" class="btn btn-blue" style="padding: 8px;">Загрузить плащ</button>
                </div>
                <div>
                    <label style="font-weight: bold; display: block; margin-bottom: 5px;"><i class="fa-solid fa-ticket"></i> Активировать промокод</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="promoInput" class="input-field" placeholder="Введите промокод" style="margin: 0;">
                        <button type="button" id="activatePromoBtn" class="btn btn-green" style="width: auto; padding: 0 20px;">ОК</button>
                    </div>
                </div>
                <div id="lkMessage" class="status-msg"></div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://hqedflvozrymweaueymk.supabase.co/rest/v1/";
        const SUPABASE_KEY = "sb_publishable_AhbI07QUWbsjEy-16VJ4zw_ymUbQ7sL";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let currentUser = null;

        document.getElementById('loginBtn').addEventListener('click', async () => {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            const msg = document.getElementById('authMessage');
            const { data, error } = await supabase.from('users').select('*').eq('username', user).single();
            if (error || !data || data.password_hash !== pass) { msg.innerText = "Неверный ник или пароль!"; msg.style.color = "#e74c3c"; } 
            else { currentUser = data; openDashboard(); }
        });

        document.getElementById('regBtn').addEventListener('click', async () => {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            const msg = document.getElementById('authMessage');
            if(user.length < 3) return;
            const { data, error } = await supabase.from('users').insert([{ username: user, password_hash: pass }]).select().single();
            if (error) { msg.innerText = "Никнейм уже занят!"; msg.style.color = "#e74c3c"; } 
            else { currentUser = data; openDashboard(); }
        });

        function openDashboard() {
            document.getElementById('authBlock').classList.add('hidden');
            document.getElementById('lkBlock').classList.remove('hidden');
            document.getElementById('navUser').innerText = "Привет, " + currentUser.username;
            document.getElementById('lkUsername').innerText = currentUser.username;
            document.getElementById('userBalance').innerText = currentUser.balance;
            if(currentUser.skin_url) document.getElementById('skinImg').src = currentUser.skin_url;
        }

        document.getElementById('uploadSkinBtn').addEventListener('click', async () => {
            const fileInput = document.getElementById('skinFile');
            const msg = document.getElementById('lkMessage');
            if (!fileInput.files.length) return;
            const file = fileInput.files[0];
            const fileName = `${currentUser.username}_skin.png`;
            const { error: uploadError } = await supabase.storage.from('skins').upload(fileName, file, { cacheControl: '3600', upsert: true });
            if (!uploadError) {
                const { data } = supabase.storage.from('skins').getPublicUrl(fileName);
                await supabase.from('users').update({ skin_url: data.publicUrl }).eq('id', currentUser.id);
                document.getElementById('skinImg').src = data.publicUrl;
                msg.innerText = "Скин успешно обновлен!"; msg.style.color = "#2ecc71";
            } else { msg.innerText = "Ошибка: " + uploadError.message; msg.style.color = "#e74c3c"; }
        });

        document.getElementById('activatePromoBtn').addEventListener('click', async () => {
            const codeInput = document.getElementById('promoInput').value.trim();
            const msg = document.getElementById('lkMessage');
            const { data: promo, error } = await supabase.from('promocodes').select('*').eq('code', codeInput).single();
            if (error || !promo || promo.uses_left <= 0) { msg.innerText = "Промокод недействителен!"; msg.style.color = "#e74c3c"; return; }
            const { data: checkAct } = await supabase.from('promocode_activations').select('*').eq('user_id', currentUser.id).eq('promocode_id', promo.id).single();
            if(checkAct) { msg.innerText = "Вы уже вводили этот код!"; msg.style.color = "#f39c12"; return; }
            const newBalance = currentUser.balance + promo.reward_money;
