<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaterLauncher Project</title>
    <!-- Подключаем официальный скрипт Supabase -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                        url('https://alphacoders.com') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            text-align: center;
        }
        header { padding: 40px 20px; }
        .logo { font-size: 3rem; font-weight: bold; text-transform: uppercase; color: #4fc3f7; text-shadow: 3px 3px 0px #000; }
        
        /* Стили формы регистрации */
        .reg-container {
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #4fc3f7;
            border-radius: 10px;
            padding: 30px;
            width: 320px;
            margin: 20px auto;
            box-shadow: 0 0 15px rgba(79, 195, 247, 0.3);
        }
        .reg-container h2 { margin-top: 0; color: #4fc3f7; }
        .input-field {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #4fc3f7;
            border-radius: 4px;
            background: #1a1a1a;
            color: #fff;
            box-sizing: border-box;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #2ecc71;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            font-size: 1rem;
            transition: 0.2s;
        }
        .btn-submit:hover { background: #27ae60; }
        #message { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div class="logo">💥 WaterProject 💥</div>
        <p>Создай аккаунт для игры на сервере 1.16.5!</p>
    </header>

    <!-- Форма регистрации -->
    <div class="reg-container">
        <h2>Регистрация</h2>
        <form id="regForm">
            <input type="text" id="username" class="input-field" placeholder="Никнейм (от 3 до 16 симв.)" required maxsize="16">
            <input type="password" id="password" class="input-field" placeholder="Пароль" required>
            <button type="submit" class="btn-submit">Создать аккаунт</button>
        </form>
        <div id="message"></div>
    </div>

    <script>
        // НАСТРОЙКА СВЯЗИ С БАЗОЙ ДАННЫХ
        const SUPABASE_URL = "https://hqedflvozrymweaueymk.supabase.co/rest/v1/";
        const SUPABASE_KEY = "sb_publishable_AhbI07QUWbsjEy-16VJ4zw_ymUbQ7sL";
        
        const supabase = @supabase/supabase-js.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgDiv = document.getElementById('message');
            msgDiv.innerText = "Обработка...";
            msgDiv.style.color = "#fff";

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            // Валидация никнейма (стандарт Minecraft)
            if (username.length < 3 || username.length > 16) {
                msgDiv.innerText = "Ник должен быть от 3 до 16 символов!";
                msgDiv.style.color = "#e74c3c";
                return;
            }

            try {
                // Отправляем запрос на вставку строки в таблицу 'users'
                const { data, error } = await supabase
                    .from('users')
                    .insert([{ username: username, password_hash: password }]); // Пока пишем пароль текстом, позже добавим хэширование

                if (error) {
                    // Если никнейм уже занят, база вернет ошибку уникальности (код 23505)
                    if (error.code === '23505') {
                        msgDiv.innerText = "Этот никнейм уже занят!";
                    } else {
                        msgDiv.innerText = "Ошибка: " + error.message;
                    }
                    msgDiv.style.color = "#e74c3c";
                } else {
                    msgDiv.innerText = "Вы успешно зарегистрированы!";
                    msgDiv.style.color = "#2ecc71";
                    document.getElementById('regForm').reset();
                }
            } catch (err) {
                msgDiv.innerText = "Сбой соединения с базой.";
                msgDiv.style.color = "#e74c3c";
            }
        });
    </script>
</body>
</html>
