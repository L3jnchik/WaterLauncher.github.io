<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaterLauncher Project</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                        url('https://alphacoders.com') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            text-align: center;
        }
        header {
            padding: 50px 20px;
        }
        .logo {
            font-size: 3rem;
            font-weight: bold;
            text-transform: uppercase;
            color: #4fc3f7;
            text-shadow: 3px 3px 0px #000;
        }
        .btn-download {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 35px;
            font-size: 1.2rem;
            background-color: #2ecc71;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            box-shadow: 0 4px 0 #27ae60;
            transition: 0.2s;
        }
        .btn-download:hover {
            background-color: #27ae60;
            transform: translateY(2px);
            box-shadow: 0 2px 0 #219653;
        }
        .servers {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 50px;
            flex-wrap: wrap;
        }
        .card {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #4fc3f7;
            border-radius: 8px;
            padding: 20px;
            width: 250px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">💥 WaterProject 💥</div>
        <p>Уникальные сервера Minecraft 1.16.5 со своим лаунчером!</p>
        <!-- Ссылка на скачивание нашего собранного лаунчера -->
        <a href="#" class="btn-download">Скачать наш лаунчер (.EXE)</a>
    </header>

    <main>
        <div class="servers">
            <div class="card">
                <h3>Survival 1.16.5</h3>
                <p>Классическое выживание, плагины, экономика.</p>
                <span style="color: #2ecc71;">Онлайн: 125/500</span>
            </div>
            <div class="card">
                <h3>TechnoMagic</h3>
                <p>Моды, автоматизация, индустрия и магия.</p>
                <span style="color: #e74c3c;">Тех. работы</span>
            </div>
        </div>
    </main>

</body>
</html>
